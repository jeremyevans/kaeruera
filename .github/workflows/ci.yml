name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    services:
      postgres:
        image: postgres:latest
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        env:
          POSTGRES_PASSWORD: postgres
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, ruby: "3.0" }
          - { os: ubuntu-24.04, ruby: 3.1 }
          - { os: ubuntu-26.04, ruby: 3.2 }
          - { os: ubuntu-26.04, ruby: 3.3 }
          - { os: ubuntu-26.04, ruby: 3.4 }
          - { os: ubuntu-26.04, ruby: "4.0" }
    name: ${{ matrix.ruby }}
    steps:
    - uses: actions/checkout@v6
    - run: sudo apt-get -yqq install libpq-dev
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - run: bundle exec rake spec_ci
